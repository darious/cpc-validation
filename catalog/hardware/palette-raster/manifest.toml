schema = 1
name = "palette-raster"
description = """
Pen colours changed in the middle of displayed characters.
Source: src/test.asm. Expected results come from the reference emulator
(CPCEC) via --bless.
"""

[setup]
model = "Cpc6128"
crtc = "Type1"
frames = 50
rom = "fixtures/test.rom"

[[verdict]]
kind = "screen_image"
golden = "goldens/screen.png"
tolerance = 0.0
