schema = 1
name = "instruction-timing-type4"
description = """
Direct-boot ROM measuring instruction timing against the raster. For each
of 82 instruction sequences it counts loop iterations between two VSYNC
starts, beginning each at a raster interrupt; the counts change with every microsecond of instruction time and
with the point inside IN A,(C) at which VSYNC is sampled. Expected values
come from the reference emulator (CPCEC) via --bless.
"""

[setup]
model = "Cpc6128"
crtc = "Type4"
frames = 360
rom = "../fixtures/test.rom"

[[verdict]]
kind = "ram_bytes"
address = 0x9000
length = 164
hex = ""
