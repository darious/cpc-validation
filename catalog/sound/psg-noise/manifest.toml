schema = 1
name = "psg-noise"
description = """
PSG noise generator (src/test.asm): noise with period 16 on channel C
(right), 500 Hz tone on channel A (left). The noise check compares the rate
of zero crossings, which follows the noise period. Expected values come
from the reference emulator (CPCEC) via --bless.
"""

[setup]
model = "Cpc6128"
crtc = "Type1"
frames = 40
rom = "fixtures/test.rom"
audio_frames = 25

[[verdict]]
kind = "audio_tone"
channel = "left"
tolerance = 0.01
frequency = 499.2

[[verdict]]
kind = "audio_tone"
channel = "right"
tolerance = 0.08
frequency = 995.6
