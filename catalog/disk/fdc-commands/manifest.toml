schema = 1
name = "fdc-commands"
description = """
Direct uPD765 command sequence against fixtures/fdc-test.dsk (see
src/test.asm): result bytes for each command and every byte read in
execution phases, including error cases. Expected values come from the
reference emulator (CPCEC) via --bless.
"""

[setup]
model = "Cpc6128"
crtc = "Type1"
frames = 150
disks = ["fixtures/fdc-test.dsk"]
rom = "fixtures/test.rom"

[[verdict]]
kind = "ram_bytes"
address = 0x9000
length = 320
hex = ""

[[verdict]]
kind = "ram_hash"
range = [0x4000, 0x6000]
sha256 = "c8bc979df6fe671b652f1f329e9827a92e2d7eb587ebe1528f26fbfd5dc80a6a"
