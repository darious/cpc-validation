schema = 1
name = "6128-boot-banner"
description = "CPC 6128 boots cleanly: 128K banner, BASIC 1.1, Ready prompt."

[setup]
model = "Cpc6128"
crtc = "Type1"
frames = 200

[[verdict]]
kind = "screen_image"
golden = "goldens/boot.png"
tolerance = 0.0

[[verdict]]
kind = "screen_text_regex"
pattern = "Amstrad 128K Microcomputer\\s+\\(v3\\)"

[[verdict]]
kind = "screen_text_contains"
needle = "BASIC 1.1"

[[verdict]]
kind = "screen_text_contains"
needle = "Ready"
