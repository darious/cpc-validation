schema = 1
name = "crtc-r7-midframe"
description = """
VSYNC row (R7) changed mid-frame, including to rows already passed.
Source: src/test.asm. Expected results come from the reference emulator
(CPCEC) via --bless.
"""

[setup]
model = "Cpc6128"
crtc = "Type1"
frames = 50
rom = "fixtures/test.rom"

[[verdict]]
kind = "screen_image"
golden = "goldens/screen.png"
tolerance = 0.0
