schema = 1
name = "crtc-r9-midframe-type0"
description = """
Character height (R9) changed mid-frame: 7, 3, 5, 7, 1, 7.
Source: src/test.asm. Expected results come from the reference emulator
(CPCEC) via --bless.
"""

[setup]
model = "Cpc6128"
crtc = "Type0"
frames = 50
rom = "../fixtures/test.rom"

[[verdict]]
kind = "screen_image"
golden = "goldens/screen.png"
tolerance = 0.0
