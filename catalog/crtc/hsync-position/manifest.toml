schema = 1
name = "crtc-hsync-position"
description = """
HSYNC position (R2) 46, 44, 48, 42, 50, 46 on successive raster interrupts: horizontal picture position.
Source: src/test.asm. Expected results come from the reference emulator
(CPCEC) via --bless.
"""

[setup]
model = "Cpc6128"
crtc = "Type1"
frames = 50
rom = "fixtures/test.rom"

[[verdict]]
kind = "screen_image"
golden = "goldens/screen.png"
tolerance = 0.0
