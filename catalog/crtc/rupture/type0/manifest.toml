schema = 1
name = "crtc-rupture-type0"
description = """
Vertical rupture: two CRTC frames per refresh (R4/R7/R12/R13 latching).
Source: src/test.asm. Expected results come from the reference emulator
(CPCEC) via --bless.
"""

[setup]
model = "Cpc6128"
crtc = "Type0"
frames = 80
rom = "../fixtures/test.rom"

[[verdict]]
kind = "screen_image"
golden = "goldens/screen.png"
tolerance = 0.0
