schema = 1
name = "crtc-overscan"
description = """
32K overscan screen with the &8000/&C000 page carry.
Source: src/test.asm. Expected results come from the reference emulator
(CPCEC) via --bless.
"""

[setup]
model = "Cpc6128"
crtc = "Type1"
frames = 30
rom = "fixtures/test.rom"

[[verdict]]
kind = "screen_image"
golden = "goldens/screen.png"
tolerance = 0.0
