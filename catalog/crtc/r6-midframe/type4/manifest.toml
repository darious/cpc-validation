schema = 1
name = "crtc-r6-midframe-type4"
description = """
Displayed rows (R6) changed mid-frame: 25, 10, 30, 5, 25, 40.
Source: src/test.asm. Expected results come from the reference emulator
(CPCEC) via --bless.
"""

[setup]
model = "Cpc6128"
