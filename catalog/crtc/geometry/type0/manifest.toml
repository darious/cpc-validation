schema = 1
name = "crtc-geometry-type0"
description = """
4-line characters, vertical adjust, narrow display and offset start.
Source: src/test.asm. Expected results come from the reference emulator
(CPCEC) via --bless.
"""

[setup]
model = "Cpc6128"
crtc = "Type0"
frames = 30
rom = "../fixtures/test.rom"

[[verdict]]
kind = "screen_image"
golden = "goldens/screen.png"
tolerance = 0.0
