[package]
name = "cpc-runner-ronald"
version = "0.1.0"
edition = "2024"
description = "Ronald adapter for the cpc-validation runner protocol."
license = "MIT"

[dependencies]
ronald-core = { path = "../../../ronald/ronald-core" }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1.0"

[[bin]]
name = "cpc-runner-ronald"
path = "src/main.rs"
